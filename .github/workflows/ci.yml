name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests are required; coverage thresholds are enforced in vitest.config.ts.
      - run: pnpm test:coverage
      # Synthesizes the stack and loads every Lambda bundle: catches bundles that build but crash on load.
      - run: pnpm --filter @racket-club/infra check:bundles

  integration:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Upgrade on purpose: change tools/aws-emulator/VERSION (also used by the local Docker image).
      - name: Install AWS Emulator
        run: |
          version=$(cat tools/aws-emulator/VERSION)
          curl -fsSLo /tmp/aws-emulator.deb \
            "https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/aws-emulator_${version}-1_amd64.deb"
          sudo apt-get install -y /tmp/aws-emulator.deb
          aws-emulator -v
      - name: Start AWS Emulator
        run: |
          nohup aws-emulator --telemetry off > "$RUNNER_TEMP/aws-emulator.log" 2>&1 &
          for i in $(seq 30); do
            curl -sf --cacert ~/.aws/emulator/9297/ca.pem https://127.0.0.1:9297/__admin/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/aws-emulator.log"
          exit 1
      - run: pnpm test:int
      - name: AWS Emulator log
        if: failure()
        run: cat "$RUNNER_TEMP/aws-emulator.log"

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @racket-club/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

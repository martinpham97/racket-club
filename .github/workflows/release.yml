name: Release

# On a version tag (v1.2.3): build and check the Launch Stack template (it must deploy without
# `cdk bootstrap`), then publish it to the public release bucket and create the GitHub release.
# Publishing runs once the repository variable RELEASE_ROLE_ARN is set (output of the
# RacketClubReleases stack); until then a tag only builds and checks.
on:
  push:
    tags: ["v*.*.*"]

env:
  RELEASE_REGION: ap-southeast-2
  RELEASE_BUCKET: racket-club-releases-ap-southeast-2

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # GitHub OIDC -> the release publisher role
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build the web app (the template includes it)
        run: pnpm --filter @racket-club/web build
      - name: Synthesize and check the release template
        working-directory: infra
        run: pnpm check:release
      - uses: actions/upload-artifact@v4
        with:
          name: racket-club-${{ github.ref_name }}
          path: |
            infra/cdk.out/RacketClub.template.json
            infra/cdk.out/RacketClub.assets.json
            infra/cdk.out/asset.*

      - name: AWS credentials (release publisher role)
        if: vars.RELEASE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.RELEASE_ROLE_ARN }}
          aws-region: ${{ env.RELEASE_REGION }}
      - name: Publish the Lambda bundles and web app
        if: vars.RELEASE_ROLE_ARN != ''
        working-directory: infra
        # Exactly what was checked above: the synthesized cloud assembly, not a new synth.
        run: pnpm exec cdk publish-assets RacketClub --app cdk.out
      - name: Publish the template
        if: vars.RELEASE_ROLE_ARN != ''
        run: |
          template=infra/cdk.out/RacketClub.template.json
          aws s3 cp "$template" "s3://$RELEASE_BUCKET/v$RELEASE_VERSION/racket-club.template.json"
          aws s3 cp "$template" "s3://$RELEASE_BUCKET/latest/racket-club.template.json"
      - name: GitHub release with the Launch Stack link
        if: vars.RELEASE_ROLE_ARN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          template_url="https://$RELEASE_BUCKET.s3.$RELEASE_REGION.amazonaws.com/v$RELEASE_VERSION/racket-club.template.json"
          encoded=$(node -p "encodeURIComponent(process.argv[1])" "$template_url")
          launch="https://$RELEASE_REGION.console.aws.amazon.com/cloudformation/home?region=$RELEASE_REGION#/stacks/quickcreate?templateURL=$encoded&stackName=RacketClub"
          cat > notes.md <<EOF
          ## Deploy Racket Club $RELEASE_VERSION

          **[Launch Stack in Sydney (ap-southeast-2)]($launch)**

          Fill in your app name and email, tick the IAM acknowledgement, and create the stack.
          Template: $template_url
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Racket Club $RELEASE_VERSION" --notes-file notes.md
